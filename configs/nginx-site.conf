server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/myserver;
    index index.html;

    access_log /var/log/nginx/myserver_access.log;
    error_log  /var/log/nginx/myserver_error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    server_tokens off;
}
