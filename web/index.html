<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux Server Deployment</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem 3rem; border-radius: 12px; max-width: 560px; }
    h1 { margin-top: 0; color: #38bdf8; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; }
    li { margin: .4rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Server deployed successfully</h1>
    <p>This page is served by <strong>Nginx</strong> on <strong>Ubuntu Server</strong>
       running inside <strong>VirtualBox</strong>.</p>
    <ul>
      <li>VM created and configured from the CLI</li>
      <li>SSH secured with keys</li>
      <li>UFW firewall allowing ports <code>22</code> and <code>80</code></li>
      <li>Service deployed and connectivity tested</li>
    </ul>
  </div>
</body>
</html>
